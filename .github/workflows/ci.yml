name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-cache:
    name: Build bin cache (C++ only)
    runs-on: ${{matrix.runner}}
    strategy:
        matrix:
            runner: [ubuntu-22.04, jetson-18.04]
            build_type: [Release]
        fail-fast: true
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
      WITH_PYTHON: OFF
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${WITH_PYTHON}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build_cache.sh "${{matrix.build_type}}" "${WITH_PYTHON}" "${STATIC_ANALYSIS}"
      - run: echo "cache_artifact_name=$(./bin_cache_config_name.sh "${{matrix.build_type}}")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  build-cache-python:
    # One cache per ABI group: Python 3.10-3.13 share ABI (tag "3"), 3.14+ broke ABI (tag "3_14").
    # x86_64 only (jetson excluded: actions/setup-python doesn't work on self-hosted ARM runners).
    name: Build Python bin cache (${{matrix.runner}}, Python ${{matrix.python-version}})
    runs-on: ${{matrix.runner}}
    strategy:
        matrix:
            runner: [ubuntu-22.04]
            build_type: [Release]
            python-version: ['3.12', '3.14']
        fail-fast: true
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build_cache.sh "${{matrix.build_type}}" "ON" "${STATIC_ANALYSIS}"
      - name: Get Python cache artifact name
        run: |
          PYTHON_ABI_TAG=$(python3 -c 'import sys; print("3_14" if sys.version_info >= (3, 14) else "3")')
          echo "cache_artifact_name=$(./bin_cache_config_name.sh "${{matrix.build_type}}" "" "${PYTHON_ABI_TAG}")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1
  
  build-cache-windows:
    name: Build bin cache (Windows, C++ only)
    runs-on: windows-latest
    strategy:
        matrix:
            build_type: [Release]
        fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build cache
        run: .github/workflows/build_cache_windows.ps1 "${{matrix.build_type}}"
      - name: Get cache artifact name
        run: |
          $name = .\bin_cache_config_name.ps1 -BuildType "${{matrix.build_type}}"
          echo "cache_artifact_name=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  build-cache-windows-python:
    # On Windows, .pyd files link against specific pythonXY.dll, so each minor version needs
    # its own cache (unlike Linux where 3.10-3.13 share ABI compatibility).
    name: Build Python bin cache (Windows, Python ${{matrix.python-version}})
    runs-on: windows-latest
    strategy:
        matrix:
            build_type: [Release]
            python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Build cache
        run: .github/workflows/build_cache_windows.ps1 "${{matrix.build_type}}" "ON"
      - name: Get Python cache artifact name
        run: |
          $verTag = python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          $name = .\bin_cache_config_name.ps1 -BuildType "${{matrix.build_type}}" -PythonVersionTag $verTag
          echo "cache_artifact_name=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  commit-cache:
    name: Commit bin cache
    needs: [build-cache, build-cache-windows, build-cache-python, build-cache-windows-python]
    runs-on: ubuntu-latest
    outputs:
      cache_commit_sha: ${{steps.cache_commit_sha.outputs.cache_commit_sha}}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf cache/*.zip
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: cache/
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Bin cache for common configurations
      - name: Export the cache commit SHA
        id: cache_commit_sha
        run: |
          echo "cache_commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  

  check-license-headers:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/check_license_headers.sh

  build-nix-cpp:
    name: Build with Static Analysis
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, macos-latest]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
        disable_coding_standards_checks: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: ON
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${{matrix.with_python}}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS="${{matrix.disable_coding_standards_checks}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}"

  test-nix:
    name: Test
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, jetson-20.04, macos-15-intel]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${{matrix.with_python}}" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}" -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS}
      - run: .github/workflows/test.sh

  test-nix-python-versions:
    name: Test Python ${{matrix.python-version}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE=Release -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS=ON -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS} -DPython3_EXECUTABLE="$(which python3)"
      - run: .github/workflows/test.sh

  test-nix-pip-package:
    name: Test pip package
    needs: commit-cache
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-22.04, jetson-20.04]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/test_pip_package.sh

  test-nix-pip-package-python-versions:
    name: Test pip package Python ${{matrix.python-version}} / ${{matrix.cc}} (${{matrix.runner}})
    needs: commit-cache
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-15-intel]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/test_pip_package.sh

  test-preinstalled-fastdds:
    name: Test with Fast-DDS preinstalled
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
      IGNORE_BIN_CACHE: TRUE
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" "${ENABLE_ROS_TESTS}" /usr/
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}" -DENABLE_TESTS=ON -DENABLE_ROS_TESTS="${ENABLE_ROS_TESTS}"
      - run: .github/workflows/test.sh

  test-nix-pip-package-preinstalled-fastdds:
    name: Test pip package with Fast-DDS preinstalled
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      IGNORE_BIN_CACHE: TRUE
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" OFF /usr/
      - run: .github/workflows/test_pip_package.sh

  test-ros2-compatibility:
    name: Test compatibility with ROS2
    runs-on: ubuntu-latest
    container:
      image: ros:${{matrix.ros}}
    strategy:
      matrix:
        ros: [humble, iron, jazzy, kilted]
        build_type: [Release, Debug]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: ON
      PYTHON_BINDINGS: ON
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${PYTHON_BINDINGS}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/sudo.sh apt install -y ros-${{matrix.ros}}-demo-nodes-cpp
      - run: bash -c "source /opt/ros/${{matrix.ros}}/setup.bash && .github/workflows/build.sh -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DSTATIC_ANALYSIS=${STATIC_ANALYSIS} -DPYTHON_BINDINGS=${PYTHON_BINDINGS} -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS}"
      - run: bash -c "source /opt/ros/${{matrix.ros}}/setup.bash && .github/workflows/test.sh"

  # Build-only check: catches compile errors early without waiting for the full
  # test suite. test-windows runs independently and also builds from scratch.
  build-windows-cpp:
    name: Build (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        with_python: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython "${{matrix.with_python}}"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPYTHON_BINDINGS=${{matrix.with_python}} -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON
      - name: Build
        run: cmake --build build -- -j 16

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        with_python: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython "${{matrix.with_python}}"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPYTHON_BINDINGS=${{matrix.with_python}} -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON -DENABLE_ROS_TESTS=OFF
      - name: Build
        run: cmake --build build -- -j 16
      - name: Test
        # until-pass:2 retries transient DDS discovery failures at the test level;
        # reliability tests also have internal --retries for per-iteration recovery.
        run: cd build && ctest --output-on-failure --repeat until-pass:2

  test-windows-python-versions:
    name: Test Python ${{matrix.python-version}} (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Configure
        run: |
          $pythonPath = (Get-Command python).Source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYTHON_BINDINGS=ON -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON -DENABLE_ROS_TESTS=OFF -DPython3_EXECUTABLE="$pythonPath"
      - name: Build
        run: cmake --build build -- -j 16
      - name: Verify Python test environment
        run: |
          python -X faulthandler -c "
          import os, sys, ctypes
          test_dir = os.path.abspath('build/test/python')
          print('Python:', sys.version)
          print('Test dir:', test_dir)
          dlls = [f for f in os.listdir(test_dir) if f.endswith('.dll') or f.endswith('.pyd')]
          print('DLLs/PYDs:', sorted(dlls))
          # Check for potentially conflicting OpenSSL DLLs in PATH
          for p in os.environ.get('PATH', '').split(os.pathsep):
              if p and os.path.isdir(p):
                  for f in os.listdir(p):
                      if f.lower().startswith(('libssl', 'libcrypto')) and f.endswith('.dll'):
                          print(f'  OpenSSL DLL: {os.path.join(p, f)}')
          os.chdir(test_dir)
          os.add_dll_directory(test_dir)
          try:
              from fastdds import DomainParticipantFactory
              print('fastdds import OK')
              factory = DomainParticipantFactory.get_instance()
              print('get_instance OK:', factory)
              factory.load_profiles()
              print('load_profiles OK')
          except Exception as e:
              print('ERROR:', type(e).__name__, e)
          "
      - name: Test
        run: cd build && ctest --output-on-failure --repeat until-pass:2

  test-windows-pip-package:
    name: Test pip package Python ${{matrix.python-version}} (Windows)
    needs: commit-cache
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Create venv and install package
        run: |
          python -m venv "$env:TEMP\provizio_dds_test_pip.venv"
          . "$env:TEMP\provizio_dds_test_pip.venv\Scripts\Activate.ps1"
          python -m pip install -v .
      - name: Test pip package
        run: |
          . "$env:TEMP\provizio_dds_test_pip.venv\Scripts\Activate.ps1"
          python test\run_parallel.py "python test\python\python_publisher.py" "python test\python\python_subscriber.py"
          python test\python\pointcloud2_test.py

  test-congested-networks-simple-discovery:
    name: Test working in congested networks (Simple Discovery)
    needs: commit-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packets_loss: [25%, 50%]
        network_delay: [250ms, 500ms]
    env:
      PACKETS_LOSS: ${{matrix.packets_loss}}
      NETWORK_DELAY: ${{matrix.network_delay}}
      DISCOVERY_SERVER: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: .github/workflows/test_congested_network.sh

  test-congested-networks-discovery-server:
    name: Test working in congested networks (Discovery Server)
    needs: commit-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packets_loss: [50%, 75%]
        network_delay: [250ms, 500ms]
    env:
      PACKETS_LOSS: ${{matrix.packets_loss}}
      NETWORK_DELAY: ${{matrix.network_delay}}
      DISCOVERY_SERVER: ON
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: .github/workflows/test_congested_network.sh

# Memory and thread sanitizer are not tested due to known issues of both types inside Fast-DDS. May be added in the future when eProsima fixes the issues.
