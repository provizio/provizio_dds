name: CI

on:
  workflow_dispatch:
  pull_request:

# Cancel any in-progress run for the same PR (or, for workflow_dispatch,
# the same ref) when a new run starts. Without this, every push to a
# feature branch racks up parallel runs on stale commits — wastes runners
# and lets the auto-committed bin-cache jobs land on top of force-pushes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    name: Build bin cache (C++ only)
    runs-on: ${{matrix.runner}}
    strategy:
        matrix:
            runner: [ubuntu-22.04, jetson-18.04]
            build_type: [Release]
        fail-fast: true
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
      WITH_PYTHON: OFF
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${WITH_PYTHON}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build_cache.sh "${{matrix.build_type}}" "${WITH_PYTHON}" "${STATIC_ANALYSIS}"
      - run: echo "cache_artifact_name=$(./bin_cache_config_name.sh "${{matrix.build_type}}")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  build-cache-python:
    # One cache per ABI group: Python 3.8-3.13 share ABI (tag "3"), 3.14+ broke ABI (tag "3_14").
    # x86_64 only (jetson excluded: actions/setup-python doesn't work on self-hosted ARM runners).
    name: Build Python bin cache (${{matrix.runner}}, Python ${{matrix.python-version}})
    runs-on: ${{matrix.runner}}
    strategy:
        matrix:
            runner: [ubuntu-22.04]
            build_type: [Release]
            python-version: ['3.8', '3.14']
        fail-fast: true
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build_cache.sh "${{matrix.build_type}}" "ON" "${STATIC_ANALYSIS}"
      - name: Get Python cache artifact name
        run: |
          PYTHON_ABI_TAG=$(python3 -c 'import sys; print("3_14" if sys.version_info >= (3, 14) else "3")')
          echo "cache_artifact_name=$(./bin_cache_config_name.sh "${{matrix.build_type}}" "" "${PYTHON_ABI_TAG}")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  build-cache-python-arm:
    # ARM Python caches (actions/setup-python doesn't work on self-hosted ARM).
    # Uses jetson-18.04 (same as build-cache) so libstdc++ 6.0.28 check passes.
    # Requires python3.8 and python3.14 pre-installed with -dev and -venv on the runner.
    name: Build Python bin cache (ARM, Python ${{matrix.python-version}})
    runs-on: jetson-18.04
    strategy:
        matrix:
            build_type: [Release]
            python-version: ['3.8', '3.14']
        fail-fast: true
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python ${{matrix.python-version}} is available
        run: |
          PY=python${{matrix.python-version}}
          if ! command -v "$PY" &>/dev/null; then
            echo "::error::$PY is not installed on this runner"
            exit 1
          fi
          "$PY" -c "import sys; print(f'Python {sys.version}')"
          "$PY" -c "import venv" || { echo "::error::$PY venv module is missing"; exit 1; }
          "$PY" -c "import sysconfig, os; assert os.path.isfile(sysconfig.get_path('include') + '/Python.h'), 'dev headers missing'" \
            || { echo "::error::$PY dev headers are missing"; exit 1; }
      - name: Create Python virtual environment
        run: |
          rm -rf /tmp/provizio_dds.venv
          python${{matrix.python-version}} -m venv /tmp/provizio_dds.venv
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build_cache.sh "${{matrix.build_type}}" "ON" "${STATIC_ANALYSIS}"
      - name: Get Python cache artifact name
        run: |
          source /tmp/provizio_dds.venv/bin/activate
          PYTHON_ABI_TAG=$(python3 -c 'import sys; print("3_14" if sys.version_info >= (3, 14) else "3")')
          echo "cache_artifact_name=$(./bin_cache_config_name.sh "${{matrix.build_type}}" "" "${PYTHON_ABI_TAG}")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1
      - name: Clean up venv
        if: always()
        run: rm -rf /tmp/provizio_dds.venv

  build-cache-windows:
    name: Build bin cache (Windows, C++ only)
    runs-on: windows-latest
    strategy:
        matrix:
            build_type: [Release]
        fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build cache
        run: .github/workflows/build_cache_windows.ps1 "${{matrix.build_type}}"
      - name: Get cache artifact name
        run: |
          $name = .\bin_cache_config_name.ps1 -BuildType "${{matrix.build_type}}"
          echo "cache_artifact_name=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  build-cache-windows-python:
    # On Windows, .pyd files link against specific pythonXY.dll, so each minor version needs
    # its own cache (unlike Linux where 3.8-3.13 share ABI compatibility).
    name: Build Python bin cache (Windows, Python ${{matrix.python-version}})
    runs-on: windows-latest
    strategy:
        matrix:
            build_type: [Release]
            python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Build cache
        run: .github/workflows/build_cache_windows.ps1 "${{matrix.build_type}}" "ON"
      - name: Get Python cache artifact name
        run: |
          $verTag = python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          $name = .\bin_cache_config_name.ps1 -BuildType "${{matrix.build_type}}" -PythonVersionTag $verTag
          echo "cache_artifact_name=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.cache_artifact_name}}
          path: cache/${{env.cache_artifact_name}}.zip
          if-no-files-found: error
          retention-days: 1

  commit-cache:
    name: Commit bin cache
    needs: [build-cache, build-cache-windows, build-cache-python, build-cache-python-arm, build-cache-windows-python]
    runs-on: ubuntu-latest
    outputs:
      cache_commit_sha: ${{steps.cache_commit_sha.outputs.cache_commit_sha}}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf cache/*.zip
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: cache/
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          # [skip ci] keeps this auto-pushed cache commit from triggering a
          # fresh pull_request run. The commit only adds prebuilt cache/*.zip
          # artifacts — nothing to test — and GitHub honours the skip
          # instruction in the HEAD commit of a PR for pull_request events.
          commit_message: "Bin cache for common configurations [skip ci]"
      - name: Export the cache commit SHA
        id: cache_commit_sha
        run: |
          echo "cache_commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  

  check-license-headers:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/check_license_headers.sh

  build-nix-cpp:
    name: Build with Static Analysis
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, macos-latest]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
        disable_coding_standards_checks: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: ON
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${{matrix.with_python}}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS="${{matrix.disable_coding_standards_checks}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}"

  test-nix:
    name: Test
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, jetson-20.04, macos-15-intel]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
      # Run the "takes long by design" reliability request/response stress tests (128 rapid
      # create/destroy iterations) only in Release. In Debug, coding_standards auto-enables ASan, under
      # which each iteration runs several times slower; on the slower runners (notably the jetson ARM
      # self-hosted runner) that stretched timing intermittently trips Fast-DDS's known asymmetric-matching
      # "Timeout waiting for request/response" limitation (volatile request/response endpoints) — a flake,
      # not a regression. Excluding them in Debug removes that noise without losing coverage: the
      # non-stress request_response tests still exercise the path under ASan in Debug, and the reliability
      # tests still run in Release. (The dedicated TSan job, test-nix-tsan, excludes them for the same reason.)
      PROVIZIO_DDS_CTEST_EXCLUDE: ${{ matrix.build_type == 'Debug' && 'reliability' || '' }}
    steps:
      - uses: actions/checkout@v4
      # Remove any stale venv left by build-cache-python-arm on shared self-hosted runners
      # (jetson-18.04 and jetson-20.04 share /tmp on the same physical machine).
      - run: rm -rf /tmp/provizio_dds.venv
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${{matrix.with_python}}" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}" -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS}
      - run: .github/workflows/test.sh

  # ThreadSanitizer. ASan/UBSan/LSan come for free on the Debug matrix above (coding_standards enables
  # them in Debug and the whole stack — provizio_dds, foonathan_memory, Fast-DDS — is built from source
  # with the flags). TSan is mutually exclusive with ASan, so it gets its own Debug+clang job here.
  test-nix-tsan:
    name: Test (ThreadSanitizer)
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest]
        cc: [clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
      # Skip the long "takes long by design" reliability stress tests under TSan (see test.sh).
      PROVIZIO_DDS_CTEST_EXCLUDE: reliability
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf /tmp/provizio_dds.venv
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "OFF" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      # TSan's shadow-memory mapping can fail under the high ASLR entropy of newer kernels
      # ("FATAL: ThreadSanitizer: unexpected memory mapping"); lower mmap randomization so it
      # initializes. Best-effort — harmless where the kernel default is already low enough.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=TRUE -DPYTHON_BINDINGS=OFF -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS}
      - run: .github/workflows/test.sh

  test-no-eigen:
    name: Test without Eigen (plain-CPU accumulation maths)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "OFF" "${STATIC_ANALYSIS}"
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE=Release -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS=OFF -DENABLE_TESTS=ON -DDISABLE_EIGEN=ON
      - run: cd build && ctest --output-on-failure -R "accumulation|point_cloud2|localization_filter"

  test-nix-python-versions:
    # Intentionally builds from source (no cache dependency) to verify the full
    # build-from-source path works for each Python version.
    name: Test Python ${{matrix.python-version}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    env:
      CC: gcc
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE=Release -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS=ON -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS} -DPython3_EXECUTABLE="$(which python3)"
      - run: .github/workflows/test.sh

  test-nix-pip-package:
    name: Test pip package
    needs: commit-cache
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, jetson-20.04]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      # Remove any stale venv left by build-cache-python-arm on shared self-hosted runners
      - run: rm -rf /tmp/provizio_dds.venv
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/test_pip_package.sh

  test-nix-pip-package-python-versions:
    name: Test pip package Python ${{matrix.python-version}} / ${{matrix.cc}} (${{matrix.runner}})
    needs: commit-cache
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, macos-15-intel]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/test_pip_package.sh

  test-nix-pip-package-python-versions-arm:
    # ARM pip package tests (actions/setup-python doesn't work on self-hosted ARM).
    # Requires python3.8 through python3.14 pre-installed on the runner.
    name: Test pip package Python ${{matrix.python-version}} / ${{matrix.cc}} (jetson-20.04)
    needs: commit-cache
    runs-on: jetson-20.04
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        cc: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: rm -rf /tmp/provizio_dds.venv
      - name: Create Python virtual environment
        run: |
          python${{matrix.python-version}} -m venv /tmp/provizio_dds.venv
          source /tmp/provizio_dds.venv/bin/activate
          python3 -m pip install wheel setuptools "numpy>=1.16" "transforms3d>=0.4.1"
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}"
      - run: .github/workflows/test_pip_package.sh
      - name: Clean up venv
        if: always()
        run: rm -rf /tmp/provizio_dds.venv

  test-preinstalled-fastdds:
    name: Test with Fast-DDS preinstalled
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
        build_type: [Debug, Release]
        cc: [gcc, clang]
        with_python: [OFF, ON]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
      IGNORE_BIN_CACHE: TRUE
      # Skip the reliability request/response stress tests in Debug (coding_standards auto-enables ASan
      # there): under ASan they run several times slower and intermittently trip Fast-DDS's known
      # asymmetric-matching "Timeout waiting for request/response" flake on slower runners, without adding
      # coverage the non-stress request_response tests (still run under ASan) and the Release reliability
      # runs don't. See the test-nix job for the full rationale.
      PROVIZIO_DDS_CTEST_EXCLUDE: ${{ matrix.build_type == 'Debug' && 'reliability' || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" "${ENABLE_ROS_TESTS}" /usr/
      - run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}" -DENABLE_TESTS=ON -DENABLE_ROS_TESTS="${ENABLE_ROS_TESTS}"
      - run: .github/workflows/test.sh

  test-nix-pip-package-preinstalled-fastdds:
    name: Test pip package with Fast-DDS preinstalled
    runs-on: ${{matrix.runner}}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      IGNORE_BIN_CACHE: TRUE
    steps:
      - uses: actions/checkout@v4
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "ON" "${STATIC_ANALYSIS}" OFF /usr/
      - run: .github/workflows/test_pip_package.sh

  test-ros2-compatibility:
    name: Test compatibility with ROS2
    runs-on: ubuntu-latest
    container:
      image: ros:${{matrix.ros}}
      # The reliability request/response tests run a service + client (multiple Fast-DDS
      # participants) concurrently, and provizio's large-sample QoS sizes each participant's
      # shared-memory segment at ~34 MB. Docker's default 64 MB /dev/shm can't hold more than
      # one, so additional participants fail to register the SHM transport ("Failed to create
      # segment ... / SHM Transport is not supported") and fall back to UDP. Give the container
      # a 512 MB /dev/shm so the SHM transport works as intended.
      options: --shm-size=512m
    strategy:
      matrix:
        ros: [humble, iron, jazzy, kilted]
        build_type: [Release, Debug]
        cc: [gcc, clang]
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: ON
      PYTHON_BINDINGS: ON
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${PYTHON_BINDINGS}" "${STATIC_ANALYSIS}"
      - run: .github/workflows/sudo.sh apt install -y ros-${{matrix.ros}}-demo-nodes-cpp
      # Coding-standards checks are disabled here (incl. the ASan that StandardConfig auto-enables in
      # Debug): the ros:* container toolchains ship clang/gcc WITHOUT the compiler-rt sanitizer runtime
      # (libclang_rt.asan*), so an instrumented Debug build fails at the CMake compiler check. This job
      # verifies ROS 2 wire interop, not coding standards — the -Werror / clang-tidy / sanitizer gates
      # run on the test-nix and test-nix-tsan jobs, which use toolchains that have the runtime.
      - run: bash -c "source /opt/ros/${{matrix.ros}}/setup.bash && .github/workflows/build.sh -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON -DSTATIC_ANALYSIS=${STATIC_ANALYSIS} -DPYTHON_BINDINGS=${PYTHON_BINDINGS} -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS}"
      - run: bash -c "source /opt/ros/${{matrix.ros}}/setup.bash && .github/workflows/test.sh"

  # Build-only check: catches compile errors early without waiting for the full
  # test suite. test-windows runs independently and also builds from scratch.
  build-windows-cpp:
    name: Build (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        with_python: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython "${{matrix.with_python}}"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPYTHON_BINDINGS=${{matrix.with_python}} -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON
      - name: Build
        run: cmake --build build -- -j 16

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        with_python: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython "${{matrix.with_python}}"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DPYTHON_BINDINGS=${{matrix.with_python}} -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON -DENABLE_ROS_TESTS=OFF
      - name: Build
        run: cmake --build build -- -j 16
      - name: Setup legacy provizio_dds 1.10.1 venv for cross-version compat
        if: matrix.with_python == 'ON'
        shell: bash
        run: |
          # Cross-version interop test against the deployed-fleet 1.10.1
          # baseline. test/python/setup_legacy_provizio_dds_venv.sh is
          # cross-platform via OSTYPE detection; on the Windows runner it
          # picks the Scripts/python.exe layout. Failure here is fatal in
          # CI to keep the cross-version matrix from silently skipping.
          venv_python=$(./test/python/setup_legacy_provizio_dds_venv.sh)
          echo "PROVIZIO_DDS_LEGACY_PYTHON=${venv_python}" >> "${GITHUB_ENV}"
      - name: Test
        run: cd build && ctest --output-on-failure

  test-windows-python-versions:
    name: Test Python ${{matrix.python-version}} (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Configure
        run: |
          $pythonPath = (Get-Command python).Source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYTHON_BINDINGS=ON -DENABLE_TESTS=ON -DDISABLE_PROVIZIO_CODING_STANDARDS_CHECKS=ON -DENABLE_ROS_TESTS=OFF -DPython3_EXECUTABLE="$pythonPath"
      - name: Build
        run: cmake --build build -- -j 16
      - name: Verify Python test environment
        run: |
          python -X faulthandler -c "
          import os, sys, ctypes
          test_dir = os.path.abspath('build/test/python')
          print('Python:', sys.version)
          print('Test dir:', test_dir)
          dlls = [f for f in os.listdir(test_dir) if f.endswith('.dll') or f.endswith('.pyd')]
          print('DLLs/PYDs:', sorted(dlls))
          # Check for potentially conflicting OpenSSL DLLs in PATH
          for p in os.environ.get('PATH', '').split(os.pathsep):
              if p and os.path.isdir(p):
                  for f in os.listdir(p):
                      if f.lower().startswith(('libssl', 'libcrypto')) and f.endswith('.dll'):
                          print(f'  OpenSSL DLL: {os.path.join(p, f)}')
          os.chdir(test_dir)
          os.add_dll_directory(test_dir)
          try:
              from fastdds import DomainParticipantFactory
              print('fastdds import OK')
              factory = DomainParticipantFactory.get_instance()
              print('get_instance OK:', factory)
              factory.load_profiles()
              print('load_profiles OK')
          except Exception as e:
              print('ERROR:', type(e).__name__, e)
          "
      - name: Setup legacy provizio_dds 1.10.1 venv for cross-version compat
        # Skip on Python 3.8 — the legacy provizio_dds 1.10.1 source build
        # via pip fails before any output on the EOL'd Python 3.8 Windows
        # toolchain (WinError 2 from the venv bootstrap). The matching
        # CMake guard in test/python/CMakeLists.txt drops
        # cross_version_compat_test from the registered set on this combo,
        # so the test step doesn't try to run it. Python 3.9+ stays on.
        if: matrix.python-version != '3.8'
        shell: bash
        run: |
          # Cross-version interop test against the deployed-fleet 1.10.1
          # baseline. The bash script is cross-platform; under Git Bash on
          # the Windows runner it builds the venv at Scripts/python.exe.
          # PYTHON_BINDINGS is always ON in this job, so no gating needed.
          venv_python=$(./test/python/setup_legacy_provizio_dds_venv.sh)
          echo "PROVIZIO_DDS_LEGACY_PYTHON=${venv_python}" >> "${GITHUB_ENV}"
      - name: Test
        run: cd build && ctest --output-on-failure

  test-windows-pip-package:
    name: Test pip package Python ${{matrix.python-version}} (Windows)
    needs: commit-cache
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          allow-prereleases: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: .\install_dependencies.ps1 -WithPython ON
      - name: Create venv and install package
        run: |
          python -m venv "$env:TEMP\provizio_dds_test_pip.venv"
          . "$env:TEMP\provizio_dds_test_pip.venv\Scripts\Activate.ps1"
          python -m pip install -v . 2>&1 | Tee-Object -FilePath "$env:TEMP\pip_install.log"
          if (-not (Select-String -Path "$env:TEMP\pip_install.log" -Pattern "Bin cache located and will be used" -Quiet)) {
            Write-Error "Binary cache was NOT used during pip install — check cache artifacts and CMake config"
            exit 1
          }
          Write-Host "Verified: binary cache was used"
      - name: Test pip package
        run: |
          . "$env:TEMP\provizio_dds_test_pip.venv\Scripts\Activate.ps1"
          python test\run_parallel.py "python test\python\python_publisher.py" "python test\python\python_subscriber.py"
          python test\python\point_cloud2_test.py

  test-congested-networks-simple-discovery:
    name: Test working in congested networks (Simple Discovery)
    needs: commit-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packets_loss: [25%, 50%]
        network_delay: [250ms, 500ms]
    env:
      PACKETS_LOSS: ${{matrix.packets_loss}}
      NETWORK_DELAY: ${{matrix.network_delay}}
      DISCOVERY_SERVER: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: .github/workflows/test_congested_network.sh

  test-congested-networks-discovery-server:
    name: Test working in congested networks (Discovery Server)
    needs: commit-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packets_loss: [50%, 75%]
        network_delay: [250ms, 500ms]
    env:
      PACKETS_LOSS: ${{matrix.packets_loss}}
      NETWORK_DELAY: ${{matrix.network_delay}}
      DISCOVERY_SERVER: ON
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{needs.commit-cache.outputs.cache_commit_sha}}
      - run: .github/workflows/test_congested_network.sh

# Memory and thread sanitizer are not tested due to known issues of both types inside Fast-DDS. May be added in the future when eProsima fixes the issues.
