name: macOS flake hunt

# TEMPORARY investigation workflow (branch investigation/**). It exists to reproduce, with
# enough diagnostics attached to explain it, the random test failures seen only on
# macos-15-intel: a test that normally finishes in under a second occasionally consumes its
# whole 45 s ctest TIMEOUT and is SIGKILLed with no output at all, and request/response
# tests occasionally lose a response right after the library reports an interface address
# disappearing and returning.
#
# Each job builds once and then runs the suite in a loop, in chunks with an artifact upload
# between them (a macos-15-intel runner that dies mid-job uploads nothing AND its log cannot
# be fetched afterwards, which already cost one shard three and a half hours of evidence).
# Running alongside every chunk:
#   - test/ci_net_watch.py: the complete, unfiltered getifaddrs reading every 20 ms, the
#     library's own filtered snapshot, the routing-event stream, and every raw PF_ROUTE
#     message with its LENGTH -- which is what proves or kills the theory that
#     network_monitor_macos.cpp discards address events as too short;
#   - test/ci_stall_watchdog.py: full thread backtraces of any test process that gets within
#     a few seconds of its own ctest TIMEOUT, captured before CTest's SIGKILL;
#   - macOS's own configd / mDNSResponder log, which says WHY an interface changed;
#   - on the two "flap" shards, test/ci_interface_flap.sh, which makes the suspected host
#     event happen on demand instead of waiting hours for it.

on:
  push:
    branches: ['investigation/**']
  workflow_dispatch:

concurrency:
  group: macos-flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: Hunt ${{matrix.label}}
    runs-on: macos-15-intel
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # THE OPEN QUESTION, four shards of it. The deadlock needs an endpoint deletion to
          # coincide with a remote participant's lease expiry, so these run only the
          # endpoint-churning tests -- a pass takes about a minute instead of five, which is
          # what turns a 1-in-44 event into something a three-hour shard can measure -- with
          # ghost participants cycling on domain 0 to supply the expiries. The two isolated
          # shards differ in exactly one thing: every test gets its own DDS domain, so the
          # ghosts (and every other test process) are invisible to them. Two of each, because
          # one shard of a rare event is an anecdote.
          - {label: deadlock-control-a, include_re: 'accumulation_dds|match_publisher_default|discovered_endpoints|keyless_topic_history|listener_drain', build_type: Release, cc: gcc, with_python: 'OFF', ghost_ms: '1500', ghosts: '4'}
          - {label: deadlock-control-b, include_re: 'accumulation_dds|match_publisher_default|discovered_endpoints|keyless_topic_history|listener_drain', build_type: Release, cc: gcc, with_python: 'OFF', ghost_ms: '1500', ghosts: '4'}
          - {label: deadlock-isolated-a, include_re: 'accumulation_dds|match_publisher_default|discovered_endpoints|keyless_topic_history|listener_drain', build_type: Release, cc: gcc, with_python: 'OFF', ghost_ms: '1500', ghosts: '4', isolate_domains: 'ON'}
          - {label: deadlock-isolated-b, include_re: 'accumulation_dds|match_publisher_default|discovered_endpoints|keyless_topic_history|listener_drain', build_type: Release, cc: gcc, with_python: 'OFF', ghost_ms: '1500', ghosts: '4', isolate_domains: 'ON'}
          # One shard still reproducing the network cause, kept only to catch the SegFault in
          # network_recovery_concurrent_make_publisher_during_reset with a crash report
          # attached -- it has appeared twice, both times with rebuilds in flight, and the
          # crash-report collection was added after the last one.
          - {label: broad-flap, exclude_re: 'reliability|cross_version_compat', build_type: Release, cc: gcc, with_python: 'ON', flap_up: '45', flap_down: '3'}
    env:
      CC: ${{matrix.cc}}
      STATIC_ANALYSIS: OFF
      ENABLE_ROS_TESTS: OFF
      PROVIZIO_DDS_CTEST_EXCLUDE: ${{matrix.exclude_re}}
      PROVIZIO_DDS_CTEST_INCLUDE: ${{matrix.include_re}}
      # Empty on every shard but the discriminator, where it is 'off'. An empty value reads
      # as unset to the library, i.e. the default (on) -- see src/network_recovery.cpp:36.
      PROVIZIO_DDS_NETWORK_RECOVERY: ${{matrix.recovery}}
      # Empty on every shard but the two accelerators.
      HUNT_FLAP_UP_SECONDS: ${{matrix.flap_up}}
      HUNT_FLAP_DOWN_SECONDS: ${{matrix.flap_down}}
      # Empty on every shard but the deadlock pair.
      HUNT_GHOST_PERIOD_MS: ${{matrix.ghost_ms}}
      HUNT_GHOST_PROCESSES: ${{matrix.ghosts}}
      # Name every address the snapshot gained or lost, not just how many.
      PROVIZIO_DDS_DEBUG_SNAPSHOT_DIFF: '1'
      HUNT_ARTIFACTS: ${{github.workspace}}/hunt-artifacts
      # Per CHUNK, not for the whole job.
      HUNT_LOOP_SECONDS: '4200'
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf /tmp/provizio_dds.venv
      - run: mkdir -p "${HUNT_ARTIFACTS}"

      - name: Record the host's starting state
        run: |
          {
            echo "=== sw_vers ==="; sw_vers || true
            echo "=== uname ==="; uname -a || true
            echo "=== cpu ==="; sysctl -n hw.ncpu hw.physicalcpu hw.memsize || true
            echo "=== ulimit ==="; ulimit -a || true
            echo "=== ifconfig -a ==="; ifconfig -a || true
            echo "=== netstat -rn ==="; netstat -rn || true
            echo "=== net sysctls ==="
            sysctl net.inet.udp.recvspace net.inet.udp.maxdgram net.inet.udp.sendspace \
                   kern.ipc.maxsockbuf net.inet.tcp.recvspace kern.maxfiles kern.maxfilesperproc 2>&1 || true
            echo "=== IPv6 temporary-address sysctls ==="
            sysctl net.inet6.ip6.use_tempaddr net.inet6.ip6.temppltime net.inet6.ip6.tempvltime 2>&1 || true
            echo "=== scutil DNS/network ==="; scutil --nwi 2>&1 || true
            echo "=== DHCP lease per interface ==="
            for i in $(ifconfig -l); do echo "-- ${i}"; ipconfig getpacket "${i}" 2>&1 | head -25; done
            echo "=== application firewall ==="
            /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>&1 || true
            /usr/libexec/ApplicationFirewall/socketfilterfw --getblockall 2>&1 || true
            echo "=== sudo -n check ==="
            sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: no"
            echo "=== sample/spindump/lldb availability ==="
            command -v sample lldb spindump lsof || true
            echo "=== routing-message header sizes ==="
            (cc -o /tmp/rt_msghdr_sizes test/ci_rt_msghdr_sizes.c 2>&1 && /tmp/rt_msghdr_sizes) || true
          } > "${HUNT_ARTIFACTS}/host_state_before.txt" 2>&1
          cat "${HUNT_ARTIFACTS}/host_state_before.txt"

      - run: .github/workflows/sudo.sh ./install_dependencies.sh "${{matrix.with_python}}" "${STATIC_ANALYSIS}" ${ENABLE_ROS_TESTS}
      - id: build
        run: .github/workflows/build.sh -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" -DSTATIC_ANALYSIS="${STATIC_ANALYSIS}" -DPYTHON_BINDINGS="${{matrix.with_python}}" -DENABLE_TESTS=ON -DENABLE_ROS_TESTS=${ENABLE_ROS_TESTS} -DPROVIZIO_DDS_TEST_ISOLATE_DOMAINS=${{matrix.isolate_domains || 'OFF'}}

      - name: Prove the sampler can attach on this runner
        # A watchdog that cannot take a backtrace here would leave the whole hunt with
        # nothing to show, and the run is hours long -- so it is verified up front, against
        # a process whose stack is known, and the result is recorded either way.
        run: |
          set +e
          /bin/sleep 120 &
          victim=$!
          {
            echo "=== ps -M ${victim} ==="; ps -M "${victim}"
            echo "=== sample (unprivileged) ==="
            sample "${victim}" 1 -mayDie -file "${HUNT_ARTIFACTS}/sampler_probe_user.txt"; echo "exit=$?"
            echo "=== sample (sudo) ==="
            sudo -n sample "${victim}" 1 -mayDie -file "${HUNT_ARTIFACTS}/sampler_probe_sudo.txt"; echo "exit=$?"
            echo "=== spindump (sudo) ==="
            sudo -n spindump "${victim}" 1 -o "${HUNT_ARTIFACTS}/sampler_probe_spindump.txt"; echo "exit=$?"
          } > "${HUNT_ARTIFACTS}/sampler_probe.txt" 2>&1
          kill "${victim}" 2>/dev/null
          cat "${HUNT_ARTIFACTS}/sampler_probe.txt"
          for f in sampler_probe_user sampler_probe_sudo sampler_probe_spindump; do
            if [ -s "${HUNT_ARTIFACTS}/${f}.txt" ]; then
              echo "--- ${f}: $(wc -l < "${HUNT_ARTIFACTS}/${f}.txt") lines, head:"
              head -25 "${HUNT_ARTIFACTS}/${f}.txt"
            else
              echo "--- ${f}: EMPTY"
            fi
          done
          exit 0

      - name: Hunt (chunk 1)
        run: .github/workflows/macos_flake_loop.sh 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{matrix.label}}-after-chunk1
          path: ${{github.workspace}}/hunt-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Hunt (chunk 2)
        # always() minus the case that matters: a build that never produced a build. Without
        # the outcome check, a shard whose Fast-DDS clone timed out ran its later chunks
        # against an empty build directory and reported 697 instant "failures".
        if: always() && steps.build.outcome == 'success'
        run: .github/workflows/macos_flake_loop.sh 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{matrix.label}}-after-chunk2
          path: ${{github.workspace}}/hunt-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Hunt (chunk 3)
        if: always() && steps.build.outcome == 'success'
        run: .github/workflows/macos_flake_loop.sh 3

      - name: Summarise
        if: always()
        run: |
          cd "${HUNT_ARTIFACTS}"
          echo "=== iterations ==="
          ls -1 ctest.*.log.gz 2>/dev/null | wc -l
          cat summary.txt 2>/dev/null || true
          echo "=== failing iterations ==="
          for f in ctest.*.log.gz; do
            [ -e "$f" ] || continue
            if gzcat "$f" | grep -q "tests failed"; then echo "$f"; fi
          done
          echo "=== every non-Passed test across all iterations ==="
          gzcat ctest.*.log.gz 2>/dev/null | grep -oE '[a-z0-9_]+ \.+ *\*\*\*[A-Za-z]+' | sort | uniq -c | sort -rn || echo "(none)"
          echo "=== stall watchdog captures ==="
          grep -h "STALL " stall_report.*.txt 2>/dev/null | head -40 || echo "(none)"
          echo "=== library-visible network changes, per iteration ==="
          for f in ctest.*.log.gz; do
            [ -e "$f" ] || continue
            n=$(gzcat "$f" | grep -c "network change detected")
            [ "$n" != "0" ] && echo "$f: $n"
          done
          echo "=== a sample of them ==="
          gzcat ctest.*.log.gz 2>/dev/null | grep -E "network change detected|network snapshot diff" | head -40 || echo "(none)"
          echo "=== kernel-visible interface changes (net watcher) ==="
          cat net_watch.c*.txt 2>/dev/null | grep -cE "RAW CHANGE|LIBRARY SNAPSHOT CHANGE" || echo 0
          cat net_watch.c*.txt 2>/dev/null | grep -E "RAW CHANGE|ZERO-USABLE|SLOW getifaddrs" | head -60 || true
          echo "=== routing messages the C++ macOS monitor would discard ==="
          cat net_watch.c*.txt 2>/dev/null | grep -c "would DISCARD it" || echo 0
          cat net_watch.c*.txt 2>/dev/null | grep "RTM " | head -30 || true
          echo "=== ghost participants ==="
          grep -hE "cycling|cycle |stopped|not accelerating" ghost_participants.c*.txt 2>/dev/null | tail -10 || echo "(not injected)"
          echo "=== injected interface flap ==="
          grep -hE "cycle|WARNING|could not|not macOS|no passwordless" interface_flap.c*.txt 2>/dev/null | tail -20 || echo "(not injected)"
          echo "=== crash reports ==="
          ls -1 crash_reports 2>/dev/null | head -20 || echo "(none)"
          for f in crash_reports/*.ips; do
            [ -e "$f" ] || continue
            echo "--- $f"
            head -60 "$f"
          done
          echo "=== leftover processes ==="
          head -40 leftover_processes.txt 2>/dev/null || echo "(none)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{matrix.label}}
          path: ${{github.workspace}}/hunt-artifacts
          if-no-files-found: warn
          retention-days: 7
